name: Validate

# The jobs that install Home Assistant are workflow_dispatch only. An ordinary
# push runs the lint job alone. .github/workflows/tests.yml runs the same two
# suites on every push.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: an unpinned linter makes CI non-reproducible.
      - name: Install ruff (PINNED)
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "ruff==0.15.21"
          python3 -m ruff --version

      - name: Ruff
        run: |
          python3 -m ruff check .
          python3 -m ruff format --check .

      # No ast.parse step here on purpose. The default python3 in this job is
      # 3.10.12 and this integration uses PEP 695 `type X = ...`, which that
      # interpreter cannot parse. Ruff already parses every file at py314, and
      # tools/validate_local.py runs in the job below.
      - name: JSON is valid
        run: |
          for f in custom_components/glkvm/*.json custom_components/glkvm/translations/*.json hacs.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$f" || exit 1
          done
          echo "all JSON valid"

      - name: Manifest sanity
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("custom_components/glkvm/manifest.json", encoding="utf-8"))
          missing = [k for k in ("domain","name","version","documentation","codeowners") if not m.get(k)]
          assert not missing, f"manifest missing: {missing}"
          assert m["domain"] == "glkvm", m["domain"]
          # A custom integration without a version silently fails to load.
          assert m["version"], "version is required for a custom integration"
          assert "quality_scale" not in m, "the badge is core-only"
          print("manifest ok:", m["domain"], m["version"])
          PY

      - name: Quality scale is complete and honest
        run: |
          python3 -m pip install --quiet "PyYAML==6.0.2"
          python3 - <<'PY'
          import json, yaml
          rules = yaml.safe_load(open(
              "custom_components/glkvm/quality_scale.yaml", encoding="utf-8"))["rules"]
          todo = sorted(k for k, v in rules.items()
                        if isinstance(v, dict) and v.get("status") == "todo")
          for name, v in rules.items():
              if isinstance(v, dict):
                  assert v.get("status") in {"done","todo","exempt"}, name
                  if v.get("status") != "done":
                      assert str(v.get("comment","")).strip(), f"{name}: needs a reason"
              else:
                  assert v == "done", name
          claimed = json.load(open(
              "custom_components/glkvm/manifest.json", encoding="utf-8")
          ).get("quality_scale")
          assert not (claimed and todo), f"manifest claims {claimed} with todo: {todo}"
          print(f"{len(rules)} rules; still todo: {', '.join(todo) or 'none'}")
          PY

  # The only job with Home Assistant installed, so it runs tests/ha/ and
  # mypy strict.
  home-assistant:
    name: Home Assistant layer
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The default python3 in this job is 3.10. Home Assistant 2026.x needs
      # 3.14: with 3.13 here, pip silently resolves the newest test package
      # that still supports 3.13, which is an old Home Assistant, and a pinned
      # current one cannot be found at all.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Two virtual environments, so the job neither inherits nor leaves
      # anything in the setup-python toolcache. A stale aiodns in that cache,
      # too old for the pycares beside it, made `import aiohttp` fail before
      # one test ran.
      #
      # pytest-homeassistant-custom-component pins Home Assistant exactly;
      # 0.13.357 is Home Assistant 2026.8.3, the version this was verified on.
      - name: Install
        run: |
          python -m venv .venv-pure
          .venv-pure/bin/python -m pip install --quiet --upgrade pip
          .venv-pure/bin/python -m pip install --quiet pytest "aiohttp==3.14.3"
          # PyYAML and Pillow are not pinned here: Home Assistant pins both,
          # and a second pin of either makes pip's resolution impossible.
          #
          # PyTurboJPEG, av and numpy are the camera and stream components'
          # own requirements, which Home Assistant installs at runtime and the
          # test harness does not; importing the camera platform needs them.
          # Pinned to the versions in the 2026.8.3 manifests.
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet \
            "mypy==1.18.2" Pillow \
            "PyTurboJPEG==1.8.3" "av==17.0.1" "numpy==2.3.2" \
            "pytest-homeassistant-custom-component==0.13.357"

      # Only pytest and aiohttp exist in this environment, so a Home Assistant
      # import creeping into api.py or models.py fails this step by itself.
      - name: Pure tests (client + models, no Home Assistant)
        run: .venv-pure/bin/python -m pytest tests/test_models.py tests/test_api.py

      # The gate is on both suites together; see .github/workflows/tests.yml.
      # The pure run here is in the other virtual environment, which has no
      # pytest-cov, so this one measures both suites itself.
      - name: Home Assistant layer tests
        run: |
          .venv/bin/python -m pytest tests/test_models.py tests/test_api.py \
            -p no:homeassistant --cov=custom_components/glkvm --cov-report=
          .venv/bin/python -m pytest tests/ha --cov=custom_components/glkvm \
            --cov-append --cov-report=term-missing --cov-fail-under=95

      - name: mypy strict
        run: .venv/bin/python -m mypy custom_components/glkvm

      # The name half of the tree scan is the only rule that reaches a
      # development host under a public domain, where no address rule and no
      # suffix rule can. The names come from a secret because naming them in
      # the tree is the disclosure the rule exists to prevent, and it is set
      # here and not in .github/workflows/tests.yml because the failure line
      # prints the name it matched and that job's log is public. Unset, the
      # run reports 0 names and the address and suffix rules still apply.
      - name: Offline HACS and hassfest checks
        env:
          HA_DEV_HOST_NAMES: ${{ secrets.HA_DEV_HOST_NAMES }}
        run: .venv/bin/python tools/validate_local.py

  hacs:
    name: hassfest + HACS
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
