name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Gitea reads .github/workflows too, so every job here is gated to github.com.
# Elsewhere they skip instantly and .gitea/workflows/validate.yml is what runs.

# Nothing here writes to the repository, publishes, or comments on a pull
# request. Each job reads the repository and nothing else.
permissions: {}

jobs:
  tests:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Home Assistant 2026.x needs Python 3.14.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      # 0.13.357 pins Home Assistant 2026.8.3; it brings pytest, its asyncio
      # and aiohttp plugins, pytest-cov, PyYAML and Pillow with it (pinning
      # those again here makes the resolution impossible).
      # PyTurboJPEG, av and numpy: the camera and stream components' own
      # requirements, needed to import the camera platform under test. uv
      # installs the same packages as pip did (compared 2026-10-30) in under
      # half the time; 0.11.31 is the uv the harness itself pins.
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install "uv==0.11.31"
          .venv/bin/python -m uv pip install --python .venv/bin/python \
            "mypy==1.18.2" "ruff==0.15.21" \
            "PyTurboJPEG==1.8.3" "av==17.0.1" "numpy==2.3.2" \
            "pytest-homeassistant-custom-component==0.13.357"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      # Both suites measure into one coverage file, and the second run is the
      # gate. api.py and models.py are covered by the pure suite alone - the
      # Home Assistant layer only ever sees them through a fake - so gating on
      # the second run by itself would gate on half the component.
      # pyproject already sets -q; a second one here would hide the summary
      # line, which is the evidence a CI log is read for.
      - run: .venv/bin/python -m pytest tests/test_models.py tests/test_api.py -p no:homeassistant --cov=custom_components/glkvm --cov-report=
      - run: .venv/bin/python -m pytest tests/ha --cov=custom_components/glkvm --cov-append --cov-report=term-missing --cov-fail-under=95
      - run: .venv/bin/python -m mypy custom_components/glkvm
      - run: .venv/bin/python tools/validate_local.py
