name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Gitea's act_runner also picks up .github/workflows, so every job here is
# gated to GitHub. On the gitea forge these skip instantly and
# .gitea/workflows/validate.yml is the one that runs.

jobs:
  tests:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio "mypy==1.18.2" "ruff==0.15.21" \
            "PyYAML==6.0.2" Pillow pytest-homeassistant-custom-component
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests/test_models.py tests/test_api.py -q -p no:homeassistant
      - run: python -m pytest tests/ha -q
      - run: python -m mypy custom_components/glkvm
      - run: python tools/validate_local.py
