name: Validate

# Required for a HACS default-store submission. Both jobs must be GREEN BEFORE
# the release is tagged - HACS checks the order the artifacts were created in,
# so a release cut before CI passes fails review even though the repo later
# turns green.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Gitea reads .github/workflows too, so every job here is gated to github.com.
# Elsewhere they skip instantly and .gitea/workflows/validate.yml is what runs.

# Nothing here writes to the repository, publishes, or comments on a pull
# request. Each job reads the repository and nothing else.
permissions: {}

jobs:
  hacs:
    if: github.server_url == 'https://github.com'
    name: HACS
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # No `ignore:` key on purpose. The hacs/default pull-request template
          # asks explicitly whether any check was ignored, and ignoring one is
          # a reason for rejection.

  hassfest:
    if: github.server_url == 'https://github.com'
    name: hassfest
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
