rules:
  # Bronze
  action-setup:
    status: done
    comment: |
      The four actions are registered in async_setup, not per entry, so a call
      while the entry is unloaded gets a translated refusal.
  appropriate-polling:
    status: done
    comment: |
      Thirty seconds. Host power, video signal and attached media change at
      human speed, and the unit's CPU belongs to its video encoder. Each
      section is read from its own endpoint rather than the bare /api/info,
      which GL.iNet's firmware makes expensive.
  brands:
    status: done
    comment: |
      Brand images ship in-repo at custom_components/glkvm/brand/, generated
      by tools/make_brand.py, which checks the sizes, a transparent
      background and that the mark fills the image. Home Assistant serves a
      custom integration's own brand folder from 2026.3, which is why
      hacs.json's minimum is 2026.3.0. A core submission would add them to
      home-assistant/brands instead.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: |
      tests/ha/test_config_flow.py covers the user step, the three error
      mappings each followed by a retry that reaches CREATE_ENTRY, the
      duplicate abort (which refreshes the moved unit's address, port and
      credentials), the no-serial fallback, reconfigure with its
      another_device guard and its error-then-recovery path, reauth in
      every outcome including recovery from a wrong password and the refusal
      of a different unit, and zeroconf in all four: a new unit confirmed to
      CREATE_ENTRY, a wrong password recovered from, a known unit followed to
      a new address, and an announcement with no readable MAC aborted. Every
      form that can show an error is checked not to echo the password. Run by
      the GitHub Tests workflow on every push.
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: |
      No external dependency. requirements is empty; the client is aiohttp
      (already in Home Assistant) plus the standard library.
  docs-actions:
    status: done
    comment: README lists every action with every field, whether it is required, and its default.
  docs-conditions:
    status: exempt
    comment: This integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration provides no triggers.
  entity-event-setup:
    status: done
    comment: |
      Entities are coordinator-driven; CoordinatorEntity subscribes in
      async_added_to_hass and unsubscribes on removal. The Wake-on-LAN and
      health-sensor listeners are registered through entry.async_on_unload.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: |
      The flow calls /api/auth/check and then reads the unit's identity before
      creating the entry, so a wrong password or a wrong address is caught on
      the form.
  test-before-setup:
    status: done
    comment: |
      async_config_entry_first_refresh raises ConfigEntryNotReady while the
      unit is unreachable and ConfigEntryAuthFailed when it refuses the
      credentials, both with translated messages.
  unique-config-entry:
    status: done
    comment: |
      The unit's serial number is the unique id, so a moved unit is not added
      twice; re-adding it updates the stored address, port and credentials.
      A unit that reports no serial falls back to its address, which still
      keeps one entry per unit. A discovered unit is matched on its MAC
      before its serial can be read, for the same reason. Every path is
      tested.

  # Silver
  action-exceptions:
    status: done
    comment: |
      Refusals caused by the request (no image selected, image change while
      attached, blank key list, malformed MAC, no ATX board, unknown or
      unloaded entry) raise ServiceValidationError; a command the unit
      refuses or fails raises HomeAssistantError, translated.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: |
      There are no options. Everything configurable (address, port,
      credentials, certificate check) is entry data, changed through the
      reconfigure flow, and documented as installation parameters.
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: |
      Coordinator failure marks everything unavailable, and a partial poll
      marks the sections that failed: every entity carries the section it
      reads and is unavailable while that section is in KvmData.failed, so a
      timeout or a 500 on one of the seven endpoints shows as unavailable
      rather than as the last value the unit confirmed. ATX, media and
      capture entities are unavailable in the states the unit reports as
      well. tests/ha/test_partial_polls.py drives each of the seven sections
      through both failures and checks that its entities, and only its
      entities, go unavailable and then return with a real value.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      DataUpdateCoordinator logs an unreachable unit once when the poll first
      fails and once at info when it recovers.
  parallel-updates: done
  reauthentication-flow:
    status: done
    comment: |
      A 401 on any poll raises ConfigEntryAuthFailed and starts reauth, which
      stops polling and keeps the integration out of GL.iNet's failed-login
      lockout. The step reads the serial of whatever answered, sets it as the
      unique id and aborts on a mismatch, so a different KVM at the stored
      address is refused rather than adopted along with this entry's device
      and history. Recovery from a wrong password and the refusal of another
      unit are both tested.
  test-coverage:
    status: done
    comment: |
      The GitHub Tests workflow measures both suites into one coverage file
      on every push and fails the job under 95%
      (--cov=custom_components/glkvm --cov-append --cov-fail-under=95). Both,
      because api.py and models.py are executed only by the pure suite: the
      Home Assistant layer replaces the client with a fake, so gating on that
      run alone would gate on half the component.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: |
      Zeroconf. Measured from a LAN host on 2026-09-04: the units announce
      _glinet._tcp.local. on 443 with TXT mn=rm10, v=<firmware>, devid and
      mac=<base64 of the twelve hex digits>. The manifest filters on mn, so
      only a Comet KVM reaches the flow. The serial an entry is keyed on is
      behind authentication and is in neither the TXT records nor
      /api/info's reach, so the confirm step asks for the login, reads the
      serial and creates the entry keyed on it.
  discovery-update-info:
    status: done
    comment: |
      The MAC is the only key the announcement and the unit's own API share
      (GET /api/system/get_network_config, result.config.mac_address), so it
      is stored in entry data by the user, reconfigure and discovery flows
      and refreshed at every setup. A discovered MAC that matches a
      configured entry updates that entry's host and reloads it rather than
      offering the unit twice; an entry from before the MAC was stored is
      still recognised by its serial in the confirm step, which updates its
      host too. Both paths are tested.
  docs-data-update: done
  docs-examples:
    status: done
    comment: |
      Four examples in the README; the one using `!input` is written as a
      script blueprint, the only place that tag resolves.
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions:
    status: done
    comment: |
      The README's entity table and its disabled-by-default list match the
      code; tests/ha/test_entities.py checks the disabled set.
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      One entry is one KVM. The things that come and go - Wake-on-LAN
      targets, GPIO channels, the health section - are entities on that
      device, and the WOL and health sets are kept in step with the unit by
      coordinator listeners.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: |
      Stream client count, H.264 bitrate, memory available and both network
      rates are disabled by default: useful when chasing a problem on the
      unit, noise on a dashboard otherwise.
  entity-translations: done
  exception-translations:
    status: done
    comment: |
      Every HomeAssistantError, ServiceValidationError, ConfigEntryAuthFailed
      and UpdateFailed carries a translation key; tools/validate_local.py
      fails on one that does not, in any module.
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: |
      Two, each for a firmware state with a known fix the user has to apply
      on the unit: the streamer not running (camera has no picture) and the
      mass-storage gadget offline (stock 1.10.0 ships it unlinked).
  stale-devices:
    status: exempt
    comment: |
      A single device removed with the entry. Entities for Wake-on-LAN
      targets removed on the unit are taken out of the entity registry on
      the next poll, and at setup for targets removed while the entry was
      unloaded, since the registry rather than the platform's memory is
      what is compared.

  # Platinum
  async-dependency:
    status: done
    comment: |
      The client is asyncio on aiohttp, in-repo (api.py and models.py, free
      of Home Assistant imports). When it is lifted into a PyPI package for a
      core submission it stays async.
  inject-websession:
    status: done
    comment: |
      Home Assistant's shared aiohttp session, via async_get_clientsession
      with the entry's verify_ssl. Authentication is per-request headers, so
      there is no cookie jar that would need isolating.
  strict-typing:
    status: done
    comment: |
      pyproject.toml runs mypy with strict = true and no relaxations, plus
      warn_unreachable, local_partial_types and no_implicit_optional, the
      three core's own mypy.ini adds for an integration in .strict-typing.
      Only the import codes core disables are disabled. The GitHub Tests job
      runs that configuration with Home Assistant installed on every push,
      which is the run that means anything: without Home Assistant every
      class it exports is Any and a local run cannot see a subclassing or
      decorator defect.
