[project]
name = "ha-glkvm"
version = "0.1.0"
description = "Home Assistant integration for GL.iNet Comet KVMs."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["custom_components/glkvm/brand"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# The pure tests load the client and models by path, so they can run on a
# machine without Home Assistant. That puts imports after code.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# pytest-homeassistant-custom-component's `hass` fixture is async, and pytest
# does not handle async fixtures natively. Without this every tests/ha test
# errors with "requested an async fixture with no plugin or hook that handled
# it" rather than failing on anything real.
asyncio_mode = "auto"

# `strict-typing` is the Platinum rule with teeth: Home Assistant runs mypy in
# strict mode over integrations that claim it. The settings below mirror the
# strict block core applies to a strict-typed integration.
[tool.mypy]
# Home Assistant 2026.x is written for 3.14 (parenthesis-free except
# expressions and the like); a lower target makes mypy stop at HA's own
# source before it reaches this integration.
python_version = "3.14"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
# Home Assistant is not installed on every machine this is linted from, and the
# client layer is deliberately importable without it. Missing HA stubs must not
# be reported as errors in the integration's own code.
ignore_missing_imports = true
follow_imports = "silent"
# Relaxed only because Home Assistant is absent locally: without it every class
# it exports is Any, so subclassing Entity reads as subclassing Any and
# @callback reads as an untyped decorator. Both are noise in that state. CI
# runs with Home Assistant installed, which is where the real check happens.
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false
