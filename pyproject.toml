[project]
name = "ha-glkvm"
version = "0.2.1"
description = "Home Assistant integration for GL.iNet Comet KVMs."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["custom_components/glkvm/brand"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# The pure tests load the client and models by path, so they can run on a
# machine without Home Assistant. That puts imports after code.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p tests.winposix loads the Windows stand-ins before the
# pytest-homeassistant-custom-component entry point plugin imports
# homeassistant.runner, which a conftest is too late for. It returns
# immediately on Linux.
addopts = "-q -p tests.winposix"
# pytest-homeassistant-custom-component's `hass` fixture is async, and pytest
# does not handle async fixtures natively. Without this every tests/ha test
# errors with "requested an async fixture with no plugin or hook that handled
# it" rather than failing on anything real.
asyncio_mode = "auto"

# `strict-typing` is the Platinum rule with teeth: Home Assistant runs mypy in
# strict mode over integrations that claim it.
#
# Home Assistant core's generated mypy.ini [mypy] block (2026.8.3), plus
# `strict`, which covers the flags core lists individually. Dropped from core's
# block: plugins, native_parser and num_workers, which are core-tree settings,
# and warn_incomplete_stub, because core type-checks its own stubs.
#
# python_version is pinned because Home Assistant 2026.x is written for 3.14;
# a lower target makes mypy stop at Home Assistant's own source before it
# reaches this integration. platform is pinned so a Windows workstation run and
# the Linux CI run resolve the same platform branches.
#
# disable_error_code carries core's exact three codes rather than
# ignore_missing_imports: an import mypy cannot resolve is not a typing defect
# in this code, and the blanket flag cannot tell those two conditions from any
# other resolution failure. The client layer is deliberately importable without
# Home Assistant.
[tool.mypy]
python_version = "3.14"
platform = "linux"
strict = true
local_partial_types = true
no_implicit_optional = true
strict_bytes = true
warn_unreachable = true
extra_checks = false
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]
disable_error_code = ["annotation-unchecked", "import-not-found", "import-untyped"]
follow_imports = "normal"
show_error_codes = true

# The tests are not the integration; CI checks custom_components/glkvm and
# never reaches here. `strict = false` does not belong in this section: mypy
# does not support `strict` per module, accepts the file without a warning and
# discards the whole section, taking the relaxations beside it with it.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
