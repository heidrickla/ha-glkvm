[project]
name = "ha-glkvm"
version = "0.1.0"
description = "Home Assistant integration for GL.iNet Comet KVMs."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["custom_components/glkvm/brand"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# The pure tests load the client and models by path, so they can run on a
# machine without Home Assistant. That puts imports after code.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# pytest-homeassistant-custom-component's `hass` fixture is async, and pytest
# does not handle async fixtures natively. Without this every tests/ha test
# errors with "requested an async fixture with no plugin or hook that handled
# it" rather than failing on anything real.
asyncio_mode = "auto"

# `strict-typing` is the Platinum rule with teeth: Home Assistant runs mypy in
# strict mode over integrations that claim it. The settings below mirror the
# strict block core applies to a strict-typed integration.
[tool.mypy]
# Home Assistant 2026.x is written for 3.14 (parenthesis-free except
# expressions and the like); a lower target makes mypy stop at HA's own
# source before it reaches this integration.
python_version = "3.14"
strict = true
# The three flags core's own mypy.ini adds on top of `strict` for an
# integration listed in .strict-typing. Everything else in that block -
# warn_return_any, disallow_untyped_defs, disallow_any_generics,
# disallow_subclassing_any, disallow_untyped_calls, disallow_untyped_decorators,
# disallow_incomplete_defs, check_untyped_defs - is already inside `strict`,
# and naming those again here would only invite switching one off.
warn_unreachable = true
local_partial_types = true
no_implicit_optional = true
# Exactly the codes core disables, for the same reason: an import mypy cannot
# resolve is not a typing defect in this code. Home Assistant is not installed
# on every machine this is linted from, and the client layer is deliberately
# importable without it. Narrower than ignore_missing_imports, which silenced
# any resolution problem at all.
disable_error_code = ["annotation-unchecked", "import-not-found", "import-untyped"]
# Home Assistant's own source is followed for the types it exports, with its
# internal errors left to core. Nothing in this integration is relaxed.
follow_imports = "silent"
# Without Home Assistant installed every class it exports is Any, so a local
# run cannot see a subclassing or decorator defect; that run is not the check.
# The GitHub Tests job runs this configuration with Home Assistant installed,
# and that run is.

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false
